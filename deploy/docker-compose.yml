# ============================================================
# RAG 系统一键启动（开发/单机生产）
# 使用：docker compose -f deploy/docker-compose.yml --env-file backend/.env up -d
# 注意：Milvus 依赖 etcd + MinIO 三个容器，首次启动需等待健康检查通过
# ============================================================

name: rag

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DB:-rag}
      MYSQL_USER: ${MYSQL_USER:-rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # 大字段（切片正文）需要放宽
      - --max_allowed_packet=64M
      - --innodb_buffer_pool_size=1G
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # MinIO 1：存放业务原始文件（对外暴露 9000/9001）
  # 说明：使用自建镜像 minio/minio:local（见 minio-build/Dockerfile）
  # 原因：Docker Hub 不可直连，且 minio/minio 在国内加速源上均不可用
  minio-docs:
    image: ${MINIO_IMAGE:-minio/minio:local}
    container_name: rag-minio-docs
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_docs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO 2：Milvus 专用，不暴露端口（不要与上面混用）
  minio-milvus:
    image: ${MINIO_IMAGE:-minio/minio:local}
    container_name: rag-minio-milvus
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minio_milvus_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: rag-etcd
    restart: unless-stopped
    logging: *default-logging
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5

  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.4}
    container_name: rag-milvus
    restart: unless-stopped
    logging: *default-logging
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio-milvus:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      TZ: Asia/Shanghai
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio-milvus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s

  # ---------------- 应用 ----------------
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../backend/.env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio-docs:9000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # 解析/切片 worker：内存峰值高，并发必须为 1
  worker-parse:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rag-worker-parse
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../backend/.env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio-docs:9000
    depends_on:
      api:
        condition: service_started
    command: >
      celery -A app.workers.celery_app.celery_app worker
      -Q parse,default -c 1 --max-memory-per-child=1500000 -l info -n parse@%h

  # 向量化 worker：网络密集，可提并发（受百炼 QPS 约束）
  worker-embed:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rag-worker-embed
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../backend/.env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio-docs:9000
    depends_on:
      api:
        condition: service_started
    command: >
      celery -A app.workers.celery_app.celery_app worker
      -Q embed -c 2 --max-memory-per-child=800000 -l info -n embed@%h

  flower:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rag-flower
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../backend/.env
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.workers.celery_app.celery_app flower --port=5555

volumes:
  mysql_data:
  redis_data:
  minio_docs_data:
  minio_milvus_data:
  etcd_data:
  milvus_data:
